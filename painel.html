<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garimpo · Painel financeiro</title><style>
:root{font-family:system-ui,Arial;color:#20312b;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:auto;padding:22px 15px 70px}h1{font-size:25px}h2{font-size:19px}p{color:#586b60}.card{background:white;border:1px solid #dce5de;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#eaf5ee;padding:15px;border-radius:12px}.stat b{display:block;font-size:23px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 4px}input,select,button{font:inherit;padding:12px;border-radius:10px;width:100%;border:1px solid #cad8ce;background:#fff}button{background:#16845b;color:white;border:0;font-weight:700;cursor:pointer;margin-top:12px}button.secondary{background:#eef5ef;color:#175a3d}button:disabled{opacity:.5}small{color:#607267}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.sale{border-top:1px solid #e3e8e3;padding:15px 0}.sale strong{display:block}.msg{white-space:pre-wrap;color:#b33131}.ok{color:#14663e}.pill{display:inline-block;border-radius:100px;background:#f8edce;padding:3px 9px;font-size:12px}
</style></head><body><main><h1>Garimpo · Controle de vendas</h1><p>Área reservada · vendas, sinais e valores a receber</p><div id="notice" class="msg"></div>
<section id="login" class="card"><h2>Entrar</h2><label>E-mail cadastrado no Supabase</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="signin">Entrar no painel</button><small>Somente usuários autorizados podem acessar as vendas.</small></section>
<section id="app" class="hidden"><button class="secondary" id="logout">Sair da conta</button><div class="grid"><div class="stat">Total vendido<b id="total">R$ 0,00</b></div><div class="stat">Já recebido<b id="paid">R$ 0,00</b></div><div class="stat">A receber<b id="due">R$ 0,00</b></div></div><div class="card"><h2>Registrar venda</h2><label>Produto</label><select id="product"><option value="">Carregando catálogo...</option></select><div class="row"><div><label>Valor negociado (R$)</label><input id="amount" type="number" step="0.01" min="0.01"></div><div><label>Valor recebido agora (R$)</label><input id="initial" type="number" step="0.01" min="0" value="0"></div></div><div class="row"><div><label>Forma de recebimento</label><select id="method"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Transferência">Transferência</option><option value="Cartão">Cartão</option></select></div><div><label>Banco / conta</label><select id="bank"><option>Inter</option><option>BTG</option><option>C6</option><option>Arc</option><option>Outro</option></select></div></div><label>Data prevista para receber o restante</label><input id="dueDate" type="date"><button id="saveSale">Salvar venda</button></div><div class="card"><h2>Vendas registradas</h2><div id="sales"></div></div><div class="card"><h2>Recebimentos por conta</h2><div id="banks"></div></div></section></main>
<script>
const URL='https://xqmkyjfxdlizhxsujff.supabase.co';const KEY='sb_publishable_wcUYhw8lVRXh-cru5s0DiQ_LsQMh_ZV';
let token='',products=[],sales=[],receipts=[];const $=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function msg(t,good=false){$('notice').textContent=t;$('notice').className=good?'ok':'msg'}
async function api(path,options={}){let r=await fetch(URL+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...options.headers}});let raw=await r.text();let data=raw?JSON.parse(raw):null;if(!r.ok)throw Error(data?.message||data?.error_description||data?.msg||'Erro '+r.status);return data}
async function getProducts(){try{let html=await(await fetch('./index.html',{cache:'no-store'})).text();let match=html.match(/const PRODUCTS\s*=\s*(\[[\s\S]*?\]);\s*const selected/);if(!match)throw Error('Formato do catálogo não reconhecido');products=JSON.parse(match[1]);}catch(e){msg('Não consegui ler os produtos do catálogo: '+e.message)}renderProducts()}
function renderProducts(){let used=new Set(sales.map(s=>s.product_id));$('product').innerHTML='<option value="">Selecione um produto</option>'+products.filter(p=>!used.has(p.id)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.id)}</option>`).join('')}
$('product').onchange=()=>{$('amount').value=products.find(p=>p.id===$('product').value)?.price||''};
async function refresh(){sales=await api('/rest/v1/garimpo_sales?select=*&order=sold_at.desc');receipts=await api('/rest/v1/garimpo_receipts?select=*&order=received_at.desc');let sold=sales.reduce((a,s)=>a+Number(s.sold_amount),0),paid=receipts.reduce((a,r)=>a+Number(r.amount),0);$('total').textContent=money(sold);$('paid').textContent=money(paid);$('due').textContent=money(sold-paid);renderProducts();renderSales();renderBanks()}
function renderSales(){let root=$('sales');root.replaceChildren();if(!sales.length){root.textContent='Nenhuma venda registrada.';return}for(let s of sales){let got=receipts.filter(r=>r.sale_id===s.id).reduce((a,r)=>a+Number(r.amount),0),left=Number(s.sold_amount)-got,p=products.find(p=>p.id===s.product_id),box=document.createElement('div');box.className='sale';box.innerHTML=`<strong>${esc(p?.name||s.product_id)}</strong><small>${esc(s.product_id)} · Vendido por ${money(s.sold_amount)}</small><p>Recebido: <b>${money(got)}</b> · A receber: <b>${money(left)}</b> ${left>0&&s.due_date?`<span class="pill">Previsto: ${esc(s.due_date)}</span>`:''}</p>`;if(left>0){let row=document.createElement('div');row.className='row';row.innerHTML=`<div><label>Recebido agora (R$)</label><input class="receiptAmount" type="number" step="0.01" min="0.01" max="${left}" value="${left.toFixed(2)}"></div><div><label>Forma</label><select class="receiptMethod"><option>Pix</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option></select></div><div><label>Conta</label><select class="receiptBank"><option>Inter</option><option>BTG</option><option>C6</option><option>Arc</option><option>Outro</option></select></div>`;let btn=document.createElement('button');btn.textContent='Registrar recebimento';btn.onclick=async()=>{let v=Number(row.querySelector('.receiptAmount').value),method=row.querySelector('.receiptMethod').value,bank=method==='Dinheiro'?null:row.querySelector('.receiptBank').value;if(!Number.isFinite(v)||v<=0||v>left+0.001){msg('Informe um valor válido até '+money(left));return}btn.disabled=true;try{await api('/rest/v1/garimpo_receipts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({sale_id:s.id,amount:v,method,bank})});msg('Recebimento salvo.',true);await refresh()}catch(e){msg(e.message)}finally{btn.disabled=false}};box.append(row,btn)}root.append(box)}}
function renderBanks(){let grouped={};for(let r of receipts){let key=r.method==='Dinheiro'?'Dinheiro':r.bank||'Conta não informada';grouped[key]=(grouped[key]||0)+Number(r.amount)}$('banks').innerHTML=Object.entries(grouped).map(([k,v])=>`<p><b>${esc(k)}</b>: ${money(v)}</p>`).join('')||'<p>Nenhum recebimento ainda.</p>'}
async function signedIn(t){token=t;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{let rows=await api('/rest/v1/garimpo_admins?select=user_id&limit=1');if(!rows.length)throw Error('Este usuário ainda não foi autorizado como administrador.');await getProducts();await refresh();msg('Painel conectado.',true)}catch(e){msg(e.message);$('app').classList.add('hidden');$('login').classList.remove('hidden')}}
$('signin').onclick=async()=>{try{let x=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});$('password').value='';await signedIn(x.access_token)}catch(e){msg('Não foi possível entrar: '+e.message)}};
$('logout').onclick=()=>{token='';$('app').classList.add('hidden');$('login').classList.remove('hidden');msg('Sessão encerrada.',true)};
$('saveSale').onclick=async()=>{let id=$('product').value,amount=Number($('amount').value),initial=Number($('initial').value),method=$('method').value,bank=method==='Dinheiro'?null:$('bank').value,due=$('dueDate').value;if(!id||!Number.isFinite(amount)||amount<=0||!Number.isFinite(initial)||initial<0||initial>amount){msg('Confira produto, valor vendido e sinal.');return}if(initial<amount&&!due){msg('Informe a data prevista do valor a receber.');return}let b=$('saveSale');b.disabled=true;let saleId;try{let result=await api('/rest/v1/garimpo_sales?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({product_id:id,sold_amount:amount,due_date:initial<amount?due:null})});saleId=result[0].id;if(initial>0)await api('/rest/v1/garimpo_receipts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({sale_id:saleId,amount:initial,method,bank})});$('initial').value='0';$('dueDate').value='';msg('Venda registrada.',true);await refresh()}catch(e){msg('Erro ao salvar: '+e.message+(saleId?' A venda foi criada; confira antes de tentar novamente.':''))}finally{b.disabled=false}};
</script></body></html>
